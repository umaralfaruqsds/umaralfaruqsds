<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kucing Sederhana</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }

        .kucing {
            position: relative;
            width: 200px;
            height: 200px;
        }

        /* Kepala Kucing */
        .kepala {
            width: 100%;
            height: 100%;
            background-color: #e67e22; /* Warna Oranye */
            border-radius: 50%;
            position: relative;
        }

        /* Telinga Kiri */
        .telinga-kiri {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid #e67e22;
            position: absolute;
            top: -20px;
            left: 10px;
            transform: rotate(-15deg);
        }

        /* Telinga Kanan */
        .telinga-kanan {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid #e67e22;
            position: absolute;
            top: -20px;
            right: 10px;
            transform: rotate(15deg);
        }

        /* Mata */
        .mata {
            width: 25px;
            height: 25px;
            background-color: #2c3e50;
            border-radius: 50%;
            position: absolute;
            top: 70px;
        }

        .mata.kiri { left: 45px; }
        .mata.kanan { right: 45px; }

        /* Hidung dan Mulut */
        .hidung {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 12px solid #e74c3c;
            position: absolute;
            top: 110px;
            left: 58px;
        }

        /* Kumis */
        .kumis-kiri, .kumis-kanan {
            position: absolute;
            width: 50px;
            height: 3px;
            background-color: #7f8c8d;
            top: 125px;
        }

        .kumis-kiri { left: -15px; transform: rotate(5deg); }
        .kumis-kanan { right: -15px; transform: rotate(-5deg); }
    </style>
</head>
<body>

    <div class="kucing">
        <div class="telinga-kiri"></div>
        <div class="telinga-kanan"></div>
        <div class="kepala">
            <div class="mata kiri"></div>
            <div class="mata kanan"></div>
            <div class="hidung"></div>
            <div class="kumis-kiri"></div>
            <div class="kumis-kanan"></div>
        </div>
    </div>

</body>
</html>
