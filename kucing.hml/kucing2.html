<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kucing di Ruangan</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d8d2c4;
    font-family: Georgia, serif;
  }

  /* ===== RUANGAN ===== */
  .room {
    position: relative;
    width: 700px;
    height: 560px;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.35);
  }

  .wall {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 72%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 60px),
      linear-gradient(180deg, #e7cdb0 0%, #dcb98f 100%);
  }

  .floor {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 28%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 4px, transparent 4px 90px),
      linear-gradient(180deg, #a9713f 0%, #8a5a30 100%);
  }
  .baseboard {
    position: absolute;
    bottom: 28%; left: 0; right: 0;
    height: 10px;
    background: #f3ead9;
  }

  /* Jendela */
  .window {
    position: absolute;
    top: 55px; left: 60px;
    width: 170px; height: 190px;
    background: linear-gradient(180deg, #bfe6ff, #eaf7ff);
    border: 10px solid #f7f2e7;
    border-radius: 6px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  }
  .window::before, .window::after {
    content: "";
    position: absolute;
    background: #f7f2e7;
  }
  .window::before { top: 50%; left: 0; right: 0; height: 8px; transform: translateY(-50%); }
  .window::after { left: 50%; top: 0; bottom: 0; width: 8px; transform: translateX(-50%); }
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.85;
  }
  .window .cloud.c1 { width: 46px; height: 18px; top: 40px; left: 15px; }
  .window .cloud.c2 { width: 34px; height: 14px; top: 100px; left: 60px; }
  .sun {
    position: absolute;
    top: 20px; left: 10px;
    width: 34px; height: 34px;
    background: radial-gradient(circle, #fff6c9, #ffe28a);
    border-radius: 50%;
    box-shadow: 0 0 18px 6px rgba(255, 226, 138, 0.6);
  }
  .curtain {
    position: absolute;
    top: 40px;
    width: 46px; height: 210px;
    background: linear-gradient(180deg, #e5988f, #d97b70);
    border-radius: 10px 10px 4px 4px;
    box-shadow: inset -6px 0 8px rgba(0,0,0,0.15);
  }
  .curtain.left { left: 30px; transform: rotate(-3deg); }
  .curtain.right { left: 212px; transform: rotate(3deg); }

  /* Bingkai foto */
  .frame {
    position: absolute;
    top: 90px; right: 90px;
    width: 90px; height: 70px;
    background: #f9f5ec;
    border: 6px solid #b5793f;
    border-radius: 4px;
    box-shadow: 0 6px 10px rgba(0,0,0,0.2);
  }
  .frame .paw-art {
    position: absolute;
    inset: 8px;
    background: #fbeee0;
  }
  .frame .paw-art::before {
    content: "🐾";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }

  /* Rak & tanaman */
  .plant-pot {
    position: absolute;
    bottom: 28%;
    right: 40px;
    width: 46px; height: 40px;
    background: linear-gradient(180deg, #c96b4e, #a84f36);
    border-radius: 0 0 10px 10px;
  }
  .plant-leaf {
    position: absolute;
    bottom: 28%;
    right: 46px;
    width: 14px; height: 46px;
    background: #4c8c52;
    border-radius: 50% 50% 0 50%;
    transform-origin: bottom center;
  }
  .plant-leaf.l1 { transform: rotate(-18deg); }
  .plant-leaf.l2 { right: 58px; transform: rotate(6deg); height: 58px; background:#5aa15f;}
  .plant-leaf.l3 { right: 34px; transform: rotate(24deg); height: 40px; }

  /* Karpet */
  .rug {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 300px; height: 90px;
    background: #d8c19f;
    border: 6px solid #c2a679;
    border-radius: 50%;
  }

  /* ===== KUCING ===== */
  .cat {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 210px;
  }

  .tail {
    position: absolute;
    bottom: 18px;
    left: -34px;
    width: 26px; height: 90px;
    background: linear-gradient(100deg, #e8934f, #f7b46a 60%, #e8934f);
    border-radius: 50% 50% 60% 40% / 60% 60% 40% 40%;
    transform: rotate(35deg);
    transform-origin: bottom center;
    box-shadow: inset -4px 0 6px rgba(0,0,0,0.15);
    z-index: 1;
  }

  .body {
    position: absolute;
    bottom: 0;
    left: 30px;
    width: 150px; height: 110px;
    background: linear-gradient(160deg, #f7b46a, #ee9a4e 70%);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    box-shadow: inset -14px -10px 20px rgba(0,0,0,0.12);
    z-index: 2;
  }
  .belly {
    position: absolute;
    bottom: 0;
    left: 60px;
    width: 92px; height: 75px;
    background: #fbe3c4;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    z-index: 3;
  }

  .paw {
    position: absolute;
    bottom: -6px;
    width: 30px; height: 22px;
    background: #fbe3c4;
    border-radius: 50%;
    z-index: 4;
    box-shadow: inset 0 -4px 4px rgba(0,0,0,0.08);
  }
  .paw.p1 { left: 48px; }
  .paw.p2 { left: 130px; }

  .head {
    position: absolute;
    bottom: 84px;
    left: 45px;
    width: 140px; height: 122px;
    background: linear-gradient(155deg, #f7b46a, #ee9a4e 75%);
    border-radius: 50%;
    box-shadow: inset -12px -10px 18px rgba(0,0,0,0.12);
    z-index: 5;
  }

  .ear {
    position: absolute;
    bottom: 178px;
    width: 0; height: 0;
    border-left: 32px solid transparent;
    border-right: 32px solid transparent;
    border-bottom: 54px solid #ee9a4e;
    z-index: 4;
  }
  .ear.left { left: 42px; transform: rotate(-24deg); }
  .ear.right { left: 148px; transform: rotate(24deg); }
  .ear-inner {
    position: absolute;
    bottom: 6px;
    width: 0; height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-bottom: 28px solid #ffcaa4;
  }
  .ear.left .ear-inner { left: -16px; }
  .ear.right .ear-inner { left: -16px; }

  .stripe {
    position: absolute;
    background: #d9822f;
    opacity: 0.55;
    border-radius: 4px;
  }
  .stripe.s1 { width: 30px; height: 6px; top: -4px; left: 30px; transform: rotate(20deg); }
  .stripe.s2 { width: 26px; height: 6px; top: -4px; right: 30px; transform: rotate(-20deg); }

  .cheek {
    position: absolute;
    bottom: 108px;
    width: 22px; height: 14px;
    background: #ff9fa8;
    border-radius: 50%;
    opacity: 0.6;
    z-index: 6;
  }
  .cheek.left { left: 56px; }
  .cheek.right { left: 142px; }

  .eye {
    position: absolute;
    bottom: 130px;
    width: 13px; height: 17px;
    background: #2b2b2b;
    border-radius: 50%;
    z-index: 6;
  }
  .eye.left { left: 78px; }
  .eye.right { left: 130px; }
  .eye::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
  }

  .nose {
    position: absolute;
    bottom: 116px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 7px solid #ff8fa3;
    z-index: 6;
  }

  .mouth {
    position: absolute;
    bottom: 100px;
    left: 50%;
    width: 26px; height: 12px;
    transform: translateX(-50%);
    border-bottom: 2px solid #5a3b28;
    border-radius: 0 0 14px 14px;
    z-index: 6;
  }

  .whisker {
    position: absolute;
    height: 2px;
    background: rgba(60,40,25,0.5);
    z-index: 6;
  }
  .whisker.l1 { bottom: 118px; left: 30px; width: 40px; transform: rotate(-6deg); }
  .whisker.l2 { bottom: 108px; left: 28px; width: 40px; }
  .whisker.r1 { bottom: 118px; left: 150px; width: 40px; transform: rotate(6deg); }
  .whisker.r2 { bottom: 108px; left: 152px; width: 40px; }

  .shadow {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 190px; height: 22px;
    background: rgba(0,0,0,0.18);
    border-radius: 50%;
    filter: blur(3px);
    z-index: 0;
  }
</style>
</head>
<body>

<div class="room">
  <div class="wall"></div>
  <div class="floor"></div>
  <div class="baseboard"></div>

  <div class="window">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>
  <div class="curtain left"></div>
  <div class="curtain right"></div>

  <div class="frame"><div class="paw-art"></div></div>

  <div class="plant-leaf l2"></div>
  <div class="plant-leaf l1"></div>
  <div class="plant-leaf l3"></div>
  <div class="plant-pot"></div>

  <div class="rug"></div>
  <div class="shadow"></div>

  <div class="cat">
    <div class="tail"></div>
    <div class="body"></div>
    <div class="belly"></div>
    <div class="paw p1"></div>
    <div class="paw p2"></div>

    <div class="ear left"><div class="ear-inner"></div></div>
    <div class="ear right"><div class="ear-inner"></div></div>
    <div class="head">
      <div class="stripe s1"></div>
      <div class="stripe s2"></div>
    </div>
    <div class="cheek left"></div>
    <div class="cheek right"></div>
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="nose"></div>
    <div class="mouth"></div>
    <div class="whisker l1"></div>
    <div class="whisker l2"></div>
    <div class="whisker r1"></div>
    <div class="whisker r2"></div>
  </div>
</div>

</body>
</html>
