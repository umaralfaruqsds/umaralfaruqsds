<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rumah Kucing</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at center, #3a3550 0%, #1c1930 100%);
    font-family: 'Segoe UI', Georgia, serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app {
    width: 760px;
    max-width: 96vw;
  }

  /* ===== NAVIGASI RUANGAN ===== */
  .nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .nav button {
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    color: #eee6ff;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background .25s, transform .2s;
  }
  .nav button:hover { transform: translateY(-2px); }
  .nav button.active {
    background: #f5a623;
    color: #3a2000;
    font-weight: bold;
    box-shadow: 0 4px 14px rgba(245,166,35,0.5);
  }

  /* ===== PANGGUNG ===== */
  .stage {
    position: relative;
    width: 100%;
    height: 500px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.45);
  }

  .room {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateX(40px) scale(0.98);
    pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
  }
  .room.active {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  .wall { position: absolute; top: 0; left: 0; right: 0; height: 70%; }
  .floor { position: absolute; bottom: 0; left: 0; right: 0; height: 30%; }
  .baseboard { position: absolute; bottom: 30%; left: 0; right: 0; height: 8px; background: #f3ead9; }

  .tip {
    position: absolute;
    bottom: 10px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    letter-spacing: .3px;
    pointer-events: none;
  }

  /* pintu penghubung antar ruangan */
  .door {
    position: absolute;
    width: 56px; height: 110px;
    background: linear-gradient(180deg, #a8703f, #8a5630);
    border-radius: 6px 6px 0 0;
    border: 4px solid #6e441f;
    cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px;
    transition: transform .15s;
  }
  .door:hover { transform: scale(1.04); }
  .door .label {
    font-size: 10px; color: #ffe9c9; background: rgba(0,0,0,0.35);
    padding: 2px 6px; border-radius: 8px; white-space: nowrap;
  }
  .door::before {
    content: "";
    position: absolute; top: 50%; right: 8px;
    width: 6px; height: 6px; background: #ffd98a; border-radius: 50%;
  }

  /* toast interaksi */
  .toast {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%) translateY(-14px);
    background: rgba(30,20,45,0.85);
    color: #ffe9c9;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ================= RUANG TAMU ================= */
  #living .wall { background: linear-gradient(180deg, #e9d2b4, #dcb98f); }
  #living .floor { background: repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0 4px, transparent 4px 90px), linear-gradient(180deg, #b0784a, #8a5a30); }

  .window { position:absolute; top:30px; left:40px; width:150px; height:160px; background:linear-gradient(180deg,#bfe6ff,#eaf7ff); border:9px solid #f7f2e7; border-radius:6px; box-shadow:0 0 24px rgba(255,255,255,.15); }
  .window::before,.window::after{content:"";position:absolute;background:#f7f2e7;}
  .window::before{top:50%;left:0;right:0;height:7px;transform:translateY(-50%);}
  .window::after{left:50%;top:0;bottom:0;width:7px;transform:translateX(-50%);}
  .sun { position:absolute; top:14px; left:10px; width:26px; height:26px; border-radius:50%; background:radial-gradient(circle,#fff6c9,#ffe28a); animation:glow 2.4s ease-in-out infinite alternate; }
  @keyframes glow{0%{box-shadow:0 0 10px 3px rgba(255,226,138,.5);}100%{box-shadow:0 0 20px 8px rgba(255,226,138,.85);}}
  .curtain{position:absolute;top:20px;width:34px;height:170px;background:linear-gradient(180deg,#e5988f,#d97b70);border-radius:8px 8px 3px 3px;transform-origin:top center;animation:curtainSway 4.5s ease-in-out infinite;}
  .curtain.cl{left:18px;}
  .curtain.cr{left:158px;animation-delay:.6s;}
  @keyframes curtainSway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}

  .frame{position:absolute;top:55px;right:70px;width:80px;height:62px;background:#f9f5ec;border:5px solid #b5793f;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 5px 8px rgba(0,0,0,.2);}

  .lamp { position:absolute; top:20px; right:26px; width:30px; cursor:pointer; text-align:center; }
  .lamp .shade { width:34px; height:24px; margin:0 auto; background:#e8b96a; border-radius:4px 4px 14px 14px; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .lamp .pole { width:4px; height:34px; background:#8a5a30; margin:0 auto; }
  .lamp .base { width:22px; height:6px; background:#6e441f; margin:0 auto; border-radius:3px; }
  .lamp .light { position:absolute; top:18px; left:50%; transform:translateX(-50%); width:70px; height:70px; border-radius:50%; background:radial-gradient(circle, rgba(255,236,168,0.55), transparent 70%); opacity:0; transition:opacity .3s; }
  .lamp.on .light { opacity:1; }
  .lamp.on .shade { background:#ffd685; box-shadow:0 0 20px 8px rgba(255,214,133,.6); }

  .sofa { position:absolute; bottom:26%; left:50%; transform:translateX(-50%); width:340px; }
  .sofa-back { width:100%; height:80px; background:linear-gradient(180deg,#d9756b,#c15b52); border-radius:22px 22px 0 0; box-shadow: inset 0 -8px 14px rgba(0,0,0,.15); }
  .sofa-seat { width:100%; height:46px; background:linear-gradient(180deg,#e08279,#c85e55); border-radius:0 0 16px 16px; position:relative; box-shadow: inset 0 6px 10px rgba(0,0,0,.12); }
  .sofa-arm { position:absolute; bottom:0; width:46px; height:110px; background:linear-gradient(180deg,#d9756b,#c15b52); border-radius:18px; box-shadow: inset -6px 0 10px rgba(0,0,0,.12); }
  .sofa-arm.left { left:-24px; }
  .sofa-arm.right { right:-24px; }
  .cushion { position:absolute; bottom:44px; width:78px; height:56px; background:#eb9088; border-radius:14px; box-shadow:0 5px 8px rgba(0,0,0,.12); }
  .cushion.c1 { left:34px; }
  .cushion.c2 { right:34px; }
  .leg { position:absolute; bottom:-14px; width:10px; height:16px; background:#6e441f; border-radius:2px; }
  .leg.l1 { left:6px; } .leg.l2 { right:6px; }

  .rug2 { position:absolute; bottom:8%; left:50%; transform:translateX(-50%); width:280px; height:60px; background:#d8c19f; border:5px solid #c2a679; border-radius:50%; }

  /* Kucing tidur di sofa */
  .sleepy-cat {
    position: absolute;
    bottom: 66px; left: 50%;
    transform: translateX(-58%);
    width: 150px; height: 70px;
    cursor: pointer;
    animation: catBreathe 3.4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes catBreathe { 0%,100%{ transform: translateX(-58%) scaleY(1);} 50%{ transform: translateX(-58%) scaleY(1.05);} }
  .sc-body {
    position:absolute; bottom:0; left:0; width:150px; height:52px;
    background: linear-gradient(160deg,#f7b46a,#ee9a4e 75%);
    border-radius: 50% 60% 45% 45% / 90% 90% 60% 60%;
    box-shadow: inset -10px -8px 16px rgba(0,0,0,.12);
  }
  .sc-head {
    position:absolute; bottom:18px; left:-6px; width:58px; height:52px;
    background: linear-gradient(155deg,#f7b46a,#ee9a4e 75%);
    border-radius: 50%;
    box-shadow: inset -8px -6px 12px rgba(0,0,0,.12);
  }
  .sc-ear { position:absolute; width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-bottom:18px solid #ee9a4e; }
  .sc-ear.l1 { top:-8px; left:2px; transform:rotate(-18deg); }
  .sc-ear.l2 { top:-8px; left:30px; transform:rotate(18deg); }
  .sc-eye { position:absolute; top:24px; width:11px; height:3px; background:#5a3b28; border-radius:2px; }
  .sc-eye.e1 { left:12px; transform:rotate(-8deg); }
  .sc-eye.e2 { left:30px; transform:rotate(8deg); }
  .sc-nose { position:absolute; top:30px; left:22px; width:5px; height:4px; background:#ff8fa3; border-radius:50%; }
  .sc-tail {
    position:absolute; bottom:6px; right:-26px; width:60px; height:24px;
    border: 11px solid #ee9a4e; border-left-color: transparent; border-bottom-color: transparent;
    border-radius: 50%;
    transform: rotate(-20deg);
    animation: tailTwitch 5s ease-in-out infinite;
    transform-origin: left center;
  }
  @keyframes tailTwitch { 0%,85%,100% { transform: rotate(-20deg);} 90% { transform: rotate(-28deg);} 95% { transform: rotate(-14deg);} }
  .zzz {
    position:absolute; top:-6px; left:36px;
    font-size:14px; color:#7a5a3a; opacity:0; font-weight:bold;
    animation: zzzFloat 3.4s ease-in infinite;
  }
  .zzz.z2 { left:48px; font-size:11px; animation-delay:.9s; }
  .zzz.z3 { left:58px; font-size:9px; animation-delay:1.8s; }
  @keyframes zzzFloat {
    0%   { opacity: 0; transform: translate(0,0) scale(0.6); }
    15%  { opacity: .9; }
    80%  { opacity: 0; }
    100% { opacity: 0; transform: translate(14px,-30px) scale(1); }
  }
  .heart-burst {
    position:absolute; top:-10px; left:20px;
    font-size: 20px; opacity: 0; pointer-events:none;
  }
  .heart-burst.show { animation: heartPop .9s ease forwards; }
  @keyframes heartPop {
    0%   { opacity: 0; transform: translateY(0) scale(0.4); }
    30%  { opacity: 1; transform: translateY(-14px) scale(1.1); }
    100% { opacity: 0; transform: translateY(-34px) scale(0.9); }
  }

  /* ================= DAPUR ================= */
  #kitchen .wall { background: linear-gradient(180deg,#cdeaf0,#b7dee6); }
  #kitchen .floor { background: repeating-conic-gradient(#d8cdb8 0deg 90deg, #cabf9f 90deg 180deg) ; background-size: 60px 60px; }

  .k-window { position:absolute; top:34px; left:280px; width:130px; height:120px; background:linear-gradient(180deg,#bfe6ff,#eaf7ff); border:8px solid #fff; border-radius:6px; }
  .k-window::before,.k-window::after{content:"";position:absolute;background:#fff;}
  .k-window::before{top:50%;left:0;right:0;height:6px;transform:translateY(-50%);}
  .k-window::after{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);}
  .k-plant { position:absolute; top:44px; left:262px; width:16px; height:16px; background:#4c8c52; border-radius:50% 50% 0 50%; }

  .cabinet-top { position:absolute; top:24px; left:26px; width:200px; height:70px; background:linear-gradient(180deg,#f4e3c8,#e7cda2); border-radius:6px; box-shadow:0 6px 10px rgba(0,0,0,.15); }
  .cabinet-top .door { position:absolute; top:8px; bottom:8px; width:88px; background:#f8ecd8; border:3px solid #d8b981; border-radius:4px; cursor:default; padding:0; }
  .cabinet-top .door.cd1{left:8px;} .cabinet-top .door.cd2{right:8px;}
  .cabinet-top .door::before{ content:""; position:absolute; right:8px; top:50%; width:5px;height:5px;background:#a97c3f;border-radius:50%; }

  .counter { position:absolute; bottom:30%; left:0; width:100%; height:100px; background:linear-gradient(180deg,#e3b27a,#c98f52); box-shadow: 0 -4px 0 #f4d9ad inset; }
  .counter-top { position:absolute; bottom:30%; left:0; width:100%; height:14px; background:#8a5a30; }

  .stove { position:absolute; bottom:calc(30% + 14px); left:60px; width:110px; height:70px; background:#4b4b52; border-radius:6px 6px 0 0; cursor:pointer; box-shadow:0 -4px 8px rgba(0,0,0,.2); }
  .stove .burner { position:absolute; top:12px; width:26px; height:26px; border-radius:50%; background:#2c2c30; border:3px solid #6b6b72; }
  .stove .burner.b1{left:12px;} .stove .burner.b2{right:12px;}
  .flame { position:absolute; top:-16px; left:50%; transform:translateX(-50%) scale(0); width:16px; height:22px; background:radial-gradient(circle,#fff4b0,#ff9a3c 60%,#ff5a3c); border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; opacity:0; transition:opacity .2s, transform .2s; }
  .stove.on .burner.b1 .flame, .stove.on .burner.b2 .flame { opacity:1; transform:translateX(-50%) scale(1); animation: flicker 0.5s ease-in-out infinite alternate; }
  @keyframes flicker { 0%{ transform:translateX(-50%) scale(1);} 100%{ transform:translateX(-50%) scale(1.12) translateY(-2px);} }
  .pot { position:absolute; top:-30px; left:50%; transform:translateX(-50%); width:34px; height:22px; background:#8f9096; border-radius:4px 4px 8px 8px; display:none; }
  .stove.on .pot { display:block; }
  .steam { position:absolute; top:-14px; left:50%; width:4px; height:14px; background:rgba(255,255,255,.7); border-radius:4px; opacity:0; }
  .stove.on .steam { animation: steamRise 1.6s ease-in infinite; }
  @keyframes steamRise { 0%{opacity:0; transform:translate(-50%,0) scaleY(.6);} 30%{opacity:.8;} 100%{opacity:0; transform:translate(-30%,-22px) scaleY(1.2);} }

  .fridge { position:absolute; bottom:30%; right:40px; width:90px; height:150px; background:linear-gradient(180deg,#f3f6f8,#dfe6ea); border-radius:8px; box-shadow:0 8px 14px rgba(0,0,0,.2); cursor:pointer; perspective: 400px; }
  .fridge .door-panel { position:absolute; inset:6px; background:linear-gradient(180deg,#fff,#e7edf0); border-radius:6px; transform-origin:left center; transition: transform .5s ease; box-shadow: inset 0 0 0 3px rgba(0,0,0,.05); }
  .fridge .handle { position:absolute; top:20px; right:8px; width:5px; height:34px; background:#b7c0c6; border-radius:3px; }
  .fridge.open .door-panel { transform: rotateY(-105deg); }
  .fridge .inside { position:absolute; inset:6px; background:#dff0ea; border-radius:6px; overflow:hidden; }
  .fridge .inside::after { content:"🥛🥕🧀"; position:absolute; top:14px; left:8px; font-size:14px; line-height:22px; }

  .k-rug { position:absolute; bottom:6%; left:50%; transform:translateX(-50%); width:220px; height:50px; background:#cfe3e6; border:5px solid #b6d2d6; border-radius:50%; }

  /* ================= KAMAR TIDUR ================= */
  #bedroom .wall { background: linear-gradient(180deg,#d9c9ec,#c6b2e0); }
  #bedroom .floor { background: repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 4px, transparent 4px 70px), linear-gradient(180deg,#b79b6b,#98803f); }

  .b-window { position:absolute; top:30px; right:36px; width:120px; height:140px; background: linear-gradient(180deg,#4a4870,#312f52); border:8px solid #efe7fb; border-radius:6px; }
  .b-window::before,.b-window::after{content:"";position:absolute;background:#efe7fb;}
  .b-window::before{top:50%;left:0;right:0;height:6px;transform:translateY(-50%);}
  .b-window::after{left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);}
  .moon { position:absolute; top:14px; right:14px; width:22px; height:22px; border-radius:50%; background:#fdf6e3; box-shadow:0 0 16px 6px rgba(253,246,227,.5); }
  .star { position:absolute; background:#fff; border-radius:50%; animation: twinkle 2s ease-in-out infinite; }
  .star.s1{ width:3px;height:3px; top:24px; left:16px; }
  .star.s2{ width:2px;height:2px; top:60px; left:40px; animation-delay:.6s; }
  .star.s3{ width:3px;height:3px; top:90px; left:20px; animation-delay:1.1s; }
  @keyframes twinkle { 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .wardrobe { position:absolute; top:22px; left:26px; width:110px; height:210px; background:linear-gradient(180deg,#8a6a45,#6e5233); border-radius:6px; box-shadow:0 8px 14px rgba(0,0,0,.25); cursor:pointer; perspective: 500px; }
  .wardrobe .wdoor { position:absolute; top:6px; bottom:6px; width:48px; background:linear-gradient(180deg,#a3805a,#8a6a45); border:2px solid #6e5233; border-radius:4px; transition: transform .5s ease; }
  .wardrobe .wdoor.wd1 { left:6px; transform-origin: left center; }
  .wardrobe .wdoor.wd2 { right:6px; transform-origin: right center; }
  .wardrobe.open .wdoor.wd1 { transform: rotateY(-100deg); }
  .wardrobe.open .wdoor.wd2 { transform: rotateY(100deg); }
  .wardrobe .inside { position:absolute; top:6px; bottom:6px; left:6px; right:6px; background:#3e2f1c; border-radius:4px; }
  .wardrobe .inside::after { content:"👕👗🧥"; position:absolute; top:16px; left:10px; font-size:13px; }

  .bed { position:absolute; bottom:16%; left:40px; width:260px; height:150px; }
  .headboard { position:absolute; left:0; top:0; width:26px; height:150px; background:linear-gradient(180deg,#b79b6b,#98803f); border-radius:8px 0 0 8px; }
  .mattress { position:absolute; left:26px; top:26px; width:234px; height:124px; background:#f4ede1; border-radius:0 14px 14px 0; box-shadow: inset 0 8px 10px rgba(0,0,0,.06); }
  .blanket { position:absolute; left:26px; top:70px; width:234px; height:80px; background:linear-gradient(160deg,#8fb4d9,#6f97c2); border-radius:0 14px 24px 10px; box-shadow: inset 0 6px 10px rgba(0,0,0,.1); }
  .blanket::before { content:""; position:absolute; top:10px; left:14px; right:14px; height:4px; background:rgba(255,255,255,.35); border-radius:4px; }
  .pillow { position:absolute; left:36px; top:34px; width:80px; height:46px; background:#fff; border-radius:14px; box-shadow:0 4px 6px rgba(0,0,0,.1); }

  .nightstand { position:absolute; bottom:16%; left:310px; width:60px; height:70px; background:linear-gradient(180deg,#a3805a,#8a6a45); border-radius:6px; box-shadow:0 6px 10px rgba(0,0,0,.2); }
  .n-lamp { position:absolute; bottom:calc(16% + 70px); left:322px; width:36px; cursor:pointer; text-align:center; }
  .n-lamp .shade { width:26px; height:20px; margin:0 auto; background:#e8b96a; border-radius:4px 4px 12px 12px; }
  .n-lamp .pole { width:3px; height:14px; background:#6e441f; margin:0 auto; }
  .n-lamp .light { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:60px; height:60px; border-radius:50%; background:radial-gradient(circle, rgba(255,236,168,0.55), transparent 70%); opacity:0; transition:opacity .3s; }
  .n-lamp.on .light { opacity:1; }
  .n-lamp.on .shade { background:#ffd685; box-shadow:0 0 18px 8px rgba(255,214,133,.55); }

  .b-rug { position:absolute; bottom:5%; left:50%; transform:translateX(-50%); width:230px; height:55px; background:#e3d3c2; border:5px solid #cdb99f; border-radius:50%; }
</style>
</head>
<body>

<div class="app">
  <div class="nav">
    <button class="active" data-room="living" onclick="goRoom('living')">🛋️ Ruang Tamu</button>
    <button data-room="kitchen" onclick="goRoom('kitchen')">🍳 Dapur</button>
    <button data-room="bedroom" onclick="goRoom('bedroom')">🛏️ Kamar Tidur</button>
  </div>

  <div class="stage">
    <div class="toast" id="toast"></div>

    <!-- ================= RUANG TAMU ================= -->
    <div class="room active" id="living">
      <div class="wall">
        <div class="window"><div class="sun"></div></div>
        <div class="curtain cl"></div>
        <div class="curtain cr"></div>
        <div class="frame">🖼️</div>
        <div class="lamp" onclick="toggleClass(this,'on'); showToast(this.classList.contains('on') ? 'Lampu dinyalakan' : 'Lampu dimatikan')">
          <div class="light"></div>
          <div class="shade"></div>
          <div class="pole"></div>
          <div class="base"></div>
        </div>
        <div class="door" style="top:20px; right:230px;" onclick="goRoom('kitchen')">
          <span class="label">Ke Dapur →</span>
        </div>
      </div>
      <div class="floor"></div>
      <div class="baseboard"></div>

      <div class="rug2"></div>
      <div class="sofa">
        <div class="sofa-arm left"><div class="leg l1"></div></div>
        <div class="sofa-arm right"><div class="leg l2"></div></div>
        <div class="sofa-back"></div>
        <div class="cushion c1"></div>
        <div class="cushion c2"></div>
        <div class="sofa-seat"></div>

        <div class="sleepy-cat" onclick="petCat(this)">
          <div class="sc-tail"></div>
          <div class="sc-body"></div>
          <div class="sc-head">
            <div class="sc-ear l1"></div>
            <div class="sc-ear l2"></div>
            <div class="sc-eye e1"></div>
            <div class="sc-eye e2"></div>
            <div class="sc-nose"></div>
          </div>
          <div class="zzz z1">Z</div>
          <div class="zzz z2">z</div>
          <div class="zzz z3">z</div>
          <div class="heart-burst">💗</div>
        </div>
      </div>
      <div class="tip">Klik lampu, foto, atau kucing yang sedang tidur ✨</div>
    </div>

    <!-- ================= DAPUR ================= -->
    <div class="room" id="kitchen">
      <div class="wall">
        <div class="cabinet-top">
          <div class="door cd1" style="cursor:default;"></div>
          <div class="door cd2" style="cursor:default;"></div>
        </div>
        <div class="k-window"></div>
        <div class="k-plant"></div>
        <div class="door" style="top:24px; left:20px;" onclick="goRoom('living')">
          <span class="label">← Ruang Tamu</span>
        </div>
        <div class="door" style="top:24px; right:20px;" onclick="goRoom('bedroom')">
          <span class="label">Ke Kamar →</span>
        </div>
      </div>
      <div class="counter"></div>
      <div class="counter-top"></div>
      <div class="floor"></div>

      <div class="stove" onclick="toggleClass(this,'on'); showToast(this.classList.contains('on') ? 'Kompor dinyalakan 🔥' : 'Kompor dimatikan')">
        <div class="burner b1"><div class="flame"></div><div class="steam"></div></div>
        <div class="burner b2"><div class="flame"></div></div>
        <div class="pot"></div>
      </div>
      <div class="fridge" onclick="toggleClass(this,'open'); showToast(this.classList.contains('open') ? 'Kulkas dibuka' : 'Kulkas ditutup')">
        <div class="inside"></div>
        <div class="door-panel"><div class="handle"></div></div>
      </div>
      <div class="k-rug"></div>
      <div class="tip">Klik kompor untuk memasak, atau kulkas untuk membukanya 🍽️</div>
    </div>

    <!-- ================= KAMAR TIDUR ================= -->
    <div class="room" id="bedroom">
      <div class="wall">
        <div class="b-window">
          <div class="moon"></div>
          <div class="star s1"></div>
          <div class="star s2"></div>
          <div class="star s3"></div>
        </div>
        <div class="wardrobe" onclick="toggleClass(this,'open'); showToast(this.classList.contains('open') ? 'Lemari dibuka' : 'Lemari ditutup')">
          <div class="inside"></div>
          <div class="wdoor wd1"></div>
          <div class="wdoor wd2"></div>
        </div>
        <div class="door" style="top:24px; left:150px;" onclick="goRoom('kitchen')">
          <span class="label">← Dapur</span>
        </div>
      </div>
      <div class="floor"></div>
      <div class="baseboard"></div>

      <div class="b-rug"></div>
      <div class="bed">
        <div class="headboard"></div>
        <div class="mattress"></div>
        <div class="pillow"></div>
        <div class="blanket"></div>
      </div>
      <div class="nightstand"></div>
      <div class="n-lamp" onclick="toggleClass(this,'on'); showToast(this.classList.contains('on') ? 'Lampu tidur dinyalakan' : 'Lampu tidur dimatikan')">
        <div class="light"></div>
        <div class="shade"></div>
        <div class="pole"></div>
      </div>
      <div class="tip">Klik lemari untuk membukanya, atau lampu tidur untuk menyalakannya 🌙</div>
    </div>
  </div>
</div>

<script>
  function goRoom(name) {
    document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    document.querySelectorAll('.nav button').forEach(b => {
      b.classList.toggle('active', b.dataset.room === name);
    });
  }

  function toggleClass(el, cls) {
    el.classList.toggle(cls);
  }

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function petCat(el) {
    const heart = el.querySelector('.heart-burst');
    heart.classList.remove('show');
    void heart.offsetWidth; // restart animasi
    heart.classList.add('show');
    showToast('Kucingnya masih tidur pulas... 💤');
  }
</script>

</body>
</html>
